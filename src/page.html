<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="浏览 {{PRIMARY_DOMAIN}} 的在售域名，通过 WhatsApp 或邮件联系询价。">
  <title>{{PRIMARY_DOMAIN}}｜域名出售</title>
  <link rel="canonical" href="{{SITE_ORIGIN}}/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%23141414'/%3E%3Ccircle cx='18' cy='18' r='10' fill='none' stroke='white' stroke-width='1.5'/%3E%3Cellipse cx='18' cy='18' rx='4.5' ry='10' fill='none' stroke='white' stroke-width='1.5'/%3E%3Cpath d='M8 18h20' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
{{CSS}}
  </style>
</head>
<body data-whatsapp="{{WHATSAPP}}" data-email="{{EMAIL}}">
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-globe" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></g>
    </symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12.1 2a9.8 9.8 0 0 0-8.5 14.7L2.3 22l5.4-1.4A9.8 9.8 0 1 0 12.1 2Zm0 17.8c-1.4 0-2.8-.4-4-1.1l-.3-.2-3.1.8.8-3-.2-.4a8 8 0 1 1 6.8 3.9Zm4.4-6-1.7-.8c-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-2.9-2.5c-.1-.2 0-.3.1-.5l.5-.6c.1-.2.1-.3 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.4c-.2 0-.4.1-.6.3-.2.2-.9.8-.9 2s.9 2.4 1 2.6c.1.2 1.7 2.6 4.2 3.6.6.2 1.1.4 1.5.4.6.1 1.2 0 1.6-.1.5-.2 1.6-.7 1.8-1.4.2-.7.2-1.2.1-1.3l-1.1-.1Z"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-down" viewBox="0 0 24 24">
      <path d="M12 4v15m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M6 18 18 6M8 6h10v10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-actions">
        <label class="language">
          <span class="visually-hidden" data-copy="language">显示语言</span>
          <svg class="icon globe" aria-hidden="true"><use href="#i-globe"/></svg>
          <select id="language">
            <option value="zh" lang="zh-CN" selected>简体中文</option>
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="pt" lang="pt">Português</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="ar" lang="ar">العربية</option>
          </select>
          <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
        </label>
        <a class="button header-email" data-contact="email" href="mailto:{{EMAIL}}" aria-label="邮件联系">
          <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
          <span data-copy="email">邮件联系</span>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="intro">
        <h1 id="page-title" data-copy="title">域名出售</h1>
        <div class="intro-detail">
          <p class="intro-copy" data-copy="intro">为你的品牌、产品或个人项目，挑一个好记的网络地址。</p>
          <a class="browse" href="#inventory">
            <span data-copy="browse">浏览在售域名</span>
            <svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>
          </a>
        </div>
      </div>

      <div class="feature" data-feature="{{PRIMARY_DOMAIN}}">
        <svg class="feature-graphic" viewBox="0 0 360 360" aria-hidden="true" fill="none" stroke="currentColor">
          <circle cx="180" cy="180" r="160"/>
          <ellipse cx="180" cy="180" rx="108" ry="160"/>
          <ellipse cx="180" cy="180" rx="53" ry="160"/>
          <path d="M180 20v320M20 180h320M40 102h280M40 258h280"/>
        </svg>
        <div>
          <span class="feature-label" data-copy="featured">精选域名</span>
          <p class="feature-name" dir="ltr"><span class="feature-stem">{{FEATURE_NAME}}</span><span class="suffix">{{FEATURE_TLD}}</span></p>
        </div>
        <div class="feature-actions">
          <a class="button button-primary" data-contact="whatsapp" href="{{FEATURE_WHATSAPP}}" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg>
            <span data-copy="inquire">WhatsApp 询价</span>
          </a>
          <a class="button button-inverse" data-contact="email" href="{{FEATURE_EMAIL}}">
            <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
            <span data-copy="emailInquiry">邮件询价</span>
          </a>
        </div>
      </div>
    </section>

    <section class="inventory" id="inventory" aria-labelledby="inventory-title">
      <div class="inventory-head">
        <div>
          <h2 id="inventory-title" data-copy="inventory">在售域名</h2>
          <p class="inventory-copy" data-copy="hint">选择域名，通过 WhatsApp 询价。</p>
        </div>
        <span class="count" id="count">共 {{COUNT}} 个</span>
      </div>

      <ul class="domains">
{{CARDS}}
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="footer-brand" href="{{SITE_ORIGIN}}/" dir="ltr">{{PRIMARY_DOMAIN}}</a>
      <div class="footer-actions">
        <a data-contact="whatsapp" href="{{WHATSAPP}}" target="_blank" rel="noopener noreferrer">
          <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg>
          <span class="visually-hidden">WhatsApp</span>
          <span dir="ltr">{{PHONE_DISPLAY}}</span>
        </a>
        <a data-contact="email" href="mailto:{{EMAIL}}">
          <svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>
          <span dir="ltr">{{EMAIL}}</span>
        </a>
      </div>
    </div>
  </footer>

  <script>
{{SCRIPT}}
  </script>
</body>
</html>
